name: wheels-release

# Compile once on our own hardware (dgx-01, self-hosted), publish flashinfer +
# vllm + b12x wheels as immutable GitHub release assets. build.sh --use-wheels
# and build-image-from-wheels.yml then assemble the runtime image from these
# wheels anywhere, without recompiling.

on:
  workflow_dispatch:
    inputs:
      vllm_ref:
        description: "vLLM fork ref to build"
        required: false
        default: "dgx-spark"
      b12x_ref:
        description: "b12x fork ref to build"
        required: false
        default: "dgx-spark"
      flashinfer_ref:
        description: "flashinfer ref (informational, recorded in build-metadata.yaml; the wheel itself is built from eugr's pinned Dockerfile flashinfer-export stage)"
        required: false
        default: ""
      tag:
        description: "Release tag (default: computed as wheels-<YYYYMMDD>-<vllm7>-<b12x7>)"
        required: false
        default: ""
      allow_while_serving:
        description: "Allow building even if a vLLM container is currently running on this runner"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: wheels
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, dgx-spark]
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4

      - name: Preflight - refuse to build while a vLLM container is running
        env:
          ALLOW_WHILE_SERVING: ${{ github.event.inputs.allow_while_serving }}
        run: |
          if docker ps --format '{{.Names}} {{.Image}}' | grep -Ei 'sparkrun|vllm'; then
            if [ "$ALLOW_WHILE_SERVING" != "true" ]; then
              echo "::error::A vLLM/sparkrun container appears to be running on this runner." >&2
              echo "Refusing to start a multi-hour compile. Re-run with allow_while_serving=true if this is intentional." >&2
              exit 1
            fi
            echo "allow_while_serving=true: proceeding despite an active container."
          else
            echo "No sparkrun/vLLM container detected; safe to build."
          fi

      - name: Compute release tag
        id: tag
        env:
          VLLM_REF: ${{ github.event.inputs.vllm_ref || 'dgx-spark' }}
          B12X_REF: ${{ github.event.inputs.b12x_ref || 'dgx-spark' }}
          TAG_INPUT: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "$TAG_INPUT" ]; then
            tag="$TAG_INPUT"
          else
            vllm7="$(git ls-remote https://github.com/ursuciprian/vllm.git "$VLLM_REF" | cut -c1-7)"
            b12x7="$(git ls-remote https://github.com/ursuciprian/b12x.git "$B12X_REF" | cut -c1-7)"
            [ -n "$vllm7" ] || vllm7="unknown"
            [ -n "$b12x7" ] || b12x7="unknown"
            tag="wheels-$(date +%Y%m%d)-${vllm7}-${b12x7}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $tag"

      - name: Build and publish wheel bundle
        env:
          VLLM_REF: ${{ github.event.inputs.vllm_ref || 'dgx-spark' }}
          B12X_REF: ${{ github.event.inputs.b12x_ref || 'dgx-spark' }}
          FLASHINFER_REF: ${{ github.event.inputs.flashinfer_ref }}
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ci/wheels_release/build_bundle.sh

      - name: Summary
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          echo "Released ${TAG}: https://github.com/${{ github.repository }}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"

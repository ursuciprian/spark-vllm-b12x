name: build-b12x-overlay

# Thin overlay on an image already on ghcr, built on a GitHub-hosted arm64 runner (never on the Sparks):
# b12x from a fork ref (+ the CUTLASS DSL it pins), optional vLLM file overlay between two fork commits, baked torch
# AOT seed removed (ci/overlay-b12x-src.Dockerfile). Before pushing it runs CPU checks inside the image (no GPU):
#   - every `from b12x... import x` in the installed vLLM resolves (ci/b12x_import_check.py); the base image is checked
#     the same way and only new failures on the Qwen serving path fail the job
#   - b12x CPU tests of the ref (GPU tests skip themselves) and, with a vLLM overlay, the vLLM tests it changed
# Pushes with GITHUB_TOKEN, so no personal credentials.
on:
  workflow_dispatch:
    inputs:
      base_image:
        description: "Image to overlay (ghcr.io/ursuciprian/spark-vllm-b12x:...)"
        required: false
        default: "ghcr.io/ursuciprian/spark-vllm-b12x:k73-20261009-21e0b201-d21d7ade-warm"
      b12x_ref:
        description: "ursuciprian/b12x branch or full commit"
        required: true
      vllm_base:
        description: "Full commit the base image's vLLM was built from (needed with vllm_ref)"
        required: false
        default: "d21d7adede68991170af760a4ae9087edc281e59"
      vllm_ref:
        description: "ursuciprian/vllm branch or full commit whose vllm/ changes over vllm_base are copied in (empty: none)"
        required: false
        default: ""
      tag:
        description: "Tag to push, e.g. ghcr.io/ursuciprian/spark-vllm-b12x:rb-20261010-<b12x>-<vllm>"
        required: true
      push:
        description: "Push the image after the checks pass"
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: build-b12x-overlay
  cancel-in-progress: false

jobs:
  overlay:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    env:
      BASE: ${{ github.event.inputs.base_image }}
      B12X_REF: ${{ github.event.inputs.b12x_ref }}
      VLLM_BASE: ${{ github.event.inputs.vllm_base }}
      VLLM_REF: ${{ github.event.inputs.vllm_ref }}
      TAG: ${{ github.event.inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/free-disk
      - name: Check inputs
        run: |
          for t in "$BASE" "$TAG"; do
            case "$t" in ghcr.io/ursuciprian/spark-vllm-b12x:*) ;; *) echo "::error::$t is not a spark-vllm-b12x tag" >&2; exit 1 ;; esac
          done
          [ -z "$VLLM_REF" ] || echo "$VLLM_BASE" | grep -qE '^[0-9a-f]{40}$' || { echo "::error::vllm_base must be a full commit" >&2; exit 1; }
          for r in "$B12X_REF" "$VLLM_REF"; do
            [ -z "$r" ] || echo "$r" | grep -qE '^[A-Za-z0-9._/][A-Za-z0-9._/-]*$' || { echo "::error::bad ref $r" >&2; exit 1; }
          done
          # never overwrite the base or an existing tag (release tags live in this package)
          [ "$TAG" != "$BASE" ] || { echo "::error::tag equals base_image" >&2; exit 1; }
          ! docker manifest inspect "$TAG" > /dev/null 2>&1 || { echo "::error::$TAG already exists on ghcr" >&2; exit 1; }
          avail=$(df --output=avail -BG / | tail -1 | tr -dc 0-9); echo "disk free ${avail} GB"
          [ "$avail" -ge 45 ] || { echo "::error::only ${avail} GB free, the base image needs ~45 GB" >&2; exit 1; }
          python3 ci/cutlass_pins.py --selftest; python3 ci/b12x_import_check.py --selftest
      - name: Docker login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build
        run: |
          docker pull -q "$BASE"
          DOCKER_BUILDKIT=1 docker build --progress=plain -f ci/overlay-b12x-src.Dockerfile \
            --build-arg BASE_IMAGE="$BASE" --build-arg B12X_REF="$B12X_REF" \
            --build-arg VLLM_BASE="$VLLM_BASE" --build-arg VLLM_REF="$VLLM_REF" -t "$TAG" .
          docker run --rm --entrypoint bash "$TAG" -c 'cat /workspace/b12x-source-commit; cat /workspace/vllm-overlay-commit 2>/dev/null; pip list 2>/dev/null | grep -iE "^(b12x|nvidia-cutlass-dsl)"; ls /opt/b12x-seed'
          df -h /
      - name: vLLM to b12x import check
        run: |
          chk() { docker run --rm --network none -e CUDA_VISIBLE_DEVICES= -v "$PWD/ci:/ci:ro" --entrypoint python3 "$1" -u /ci/b12x_import_check.py /usr/local/lib/python3.12/dist-packages/vllm; }
          chk "$BASE" > base.txt || true
          chk "$TAG" > new.txt || true
          for f in base.txt new.txt; do grep -q ' imports checked' $f || { echo "::error::import check did not complete ($f)"; tail -20 $f; exit 1; }; done
          tail -1 base.txt; tail -1 new.txt
          grep -v ' imports checked' base.txt | sed 's/:[0-9]*:/:/' | sort > base.s; grep -v ' imports checked' new.txt | sed 's/:[0-9]*:/:/' | sort > new.s
          echo "== unresolved only in the new image"; comm -13 base.s new.s | tee only-new.txt
          if grep -q '^QWEN ' only-new.txt; then echo "::error::new unresolved b12x imports on the Qwen path"; exit 1; fi
      - name: CPU tests (GPU tests skip)
        run: |
          # the image has no pytest: pytest + its two small deps (packaging/pygments come from the image), mounted read-only
          python3 -m pip install -q --break-system-packages --no-deps --target pylib pytest==8.4.2 pluggy==1.6.0 iniconfig==2.1.0
          # test the exact commits the image carries, not whatever the refs point at now
          B=$(docker run --rm --entrypoint cat "$TAG" /workspace/b12x-source-commit)
          git clone -q --filter=blob:none https://github.com/ursuciprian/b12x.git b12x-src && git -C b12x-src checkout -q "$B"
          V=
          if [ -n "$VLLM_REF" ]; then
            VC=$(docker run --rm --entrypoint cat "$TAG" /workspace/vllm-overlay-commit)
            git clone -q --filter=blob:none --no-checkout https://github.com/ursuciprian/vllm.git vllm-src
            if git -C vllm-src cat-file -e "$VC:tests/v1/executor/test_b12x_startup.py"; then
              git -C vllm-src checkout -q "$VC" -- tests/v1/executor/test_b12x_startup.py; V=/v/tests/v1/executor/test_b12x_startup.py; fi
          fi
          # one pytest per target under a hard timeout, so a hung test shows up as a named failure, not a cancelled job
          # gating: our features and their neighbours; info: upstream suites that need a GPU or hang without one
          # (tests/preparation hit the 15 min cap on CPU, tests/loader fails without CUDA), reported but not gating
          T="/b/tests/moe/test_wm_decode_plan.py /b/tests/moe/test_wm_decode.py /b/tests/sequence/test_gdn_deferred_checkpoints.py
             /b/tests/sequence/test_gdn_decode.py /b/tests/test_registry.py /b/tests/test_packaging.py $V"
          T=$(echo $T)   # one line: the list goes into a bash -c for loop
          I="/b/tests/preparation /b/tests/loader"
          docker run --rm --network none -e CUDA_VISIBLE_DEVICES= -v "$PWD/pylib:/pylib:ro" -e PYTHONPATH=/pylib -v "$PWD/b12x-src:/b:ro" ${V:+-v "$PWD/vllm-src:/v:ro"} --entrypoint bash "$TAG" -c "
            set -u; cd /tmp
            python3 -c 'import pytest' 2>/dev/null || { echo 'pytest did not import'; exit 3; }
            ! python3 -c 'import tests' 2>/dev/null || { echo 'a top-level tests package in the image would shadow /b/tests'; exit 3; }
            bad=
            for t in $T; do
              # append mode: b12x resolves to the installed package, tests.* to /b
              timeout -k 10 900 python3 -m pytest -q -p no:cacheprovider --import-mode=append -rs \$t > /tmp/out.txt 2>&1; r=\$?
              echo \"== \$t: exit \$r\"; tail -12 /tmp/out.txt
              case \$r in 0|5) ;; 124|137) bad=\"\$bad \$t(timeout)\" ;; *) bad=\"\$bad \$t(exit \$r)\" ;; esac
            done
            for t in $I; do
              timeout -k 10 300 python3 -m pytest -q -p no:cacheprovider --import-mode=append -rfE \$t > /tmp/out.txt 2>&1; r=\$?
              echo \"== info \$t: exit \$r\"; grep -E '^(FAILED|ERROR) ' /tmp/out.txt | cut -c1-220 | head -20; tail -1 /tmp/out.txt
            done
            echo \"failed:\${bad:- none}\"; [ -z \"\$bad\" ]"
      - name: Push
        if: github.event.inputs.push == 'true'
        run: |
          docker push -q "$TAG"
          docker image inspect "$TAG" --format '{{join .RepoDigests "\n"}}'
      - name: Docker logout
        if: always()
        run: docker logout ghcr.io || true

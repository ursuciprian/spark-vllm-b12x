name: free-disk
description: Remove preinstalled toolchains and prune Docker to free disk on GitHub-hosted arm64 runners (~14GB free by default).
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        echo "== disk before cleanup =="
        df -h /
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
          /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost /usr/lib/jvm \
          2>/dev/null || true
        docker system prune -af || true
        echo "== disk after cleanup =="
        df -h /
